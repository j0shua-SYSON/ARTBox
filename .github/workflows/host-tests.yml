name: host-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binder-native-build:
    name: AOSP Binder Android ARM64 build
    needs: host
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ARTBOX_ISOLATE_HOME: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binder-aidl-macos-15
          path: build/m4/binder-aidl
      - name: Compile real libbinder and libutils with the Android kernel IPC profile
        run: python3 -B scripts/build_binder.py --aidl-dir build/m4/binder-aidl/darwin-arm64 --jobs 2
      - name: Preserve archives, unresolved imports, sources and notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binder-native-build
          path: build/m4/binder-native
          if-no-files-found: error
          retention-days: 7
  binder-kernel-reference:
    name: Binder device reference (native Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ARTBOX_ISOLATE_HOME: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record the actual native kernel and package candidates
        run: python3 -B scripts/probe_binder.py
      - name: Test real Binder ioctls in a private native binderfs context
        run: python3 -B scripts/binder_reference.py --run-native --disposable-host --compare-driver
      - name: Preserve reference evidence without distributing kernel modules
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binder-kernel-reference
          path: |
            artifacts/m4-binder-capabilities.json
            artifacts/m4-binder-kernel-reference.json
            build/m4/kernel-reference/reference.log
            build/m4/kernel-reference/core/comparison.log
          if-no-files-found: warn
          retention-days: 7
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
          - os: ubuntu-24.04
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test the portable core
        run: |
          ${{ matrix.python }} -B tests/test_environment.py
          ${{ matrix.python }} -B tests/test_sources.py
          ${{ matrix.python }} -B tests/test_binder_reference.py
          ${{ matrix.python }} -B tests/test_binder_aidl.py
          ${{ matrix.python }} -B tests/test_binder_build.py
          ${{ matrix.python }} -B tests/test_classlib_build.py
          ${{ matrix.python }} -B tests/test_jdk.py
          ${{ matrix.python }} -B tests/test_bionic_adapt.py
          ${{ matrix.python }} -B tests/test_art_host_adapt.py
          ${{ matrix.python }} -B tests/test_bionic_syscalls.py
          ${{ matrix.python }} -B tests/test_dynamic_pack.py
          ${{ matrix.python }} -B tests/test_tls_adapt.py
          ${{ matrix.python }} -B tests/test_art_native_tls.py
          ${{ matrix.python }} -B tests/test_art_guest_link.py
          ${{ matrix.python }} -B tests/test_icu_guest_link.py
          ${{ matrix.python }} -B tests/test_art_runtime_progress.py
          ${{ matrix.python }} -B tests/test_art_bundle.py
          ${{ matrix.python }} -B tests/test_libcore_guest_link.py
          ${{ matrix.python }} -B tests/test_m2_acceptance.py
          ${{ matrix.python }} -B scripts/build.py host
      - name: Check ART's native low-address heap requirement
        run: ${{ matrix.python }} -B scripts/test_low_address.py
      - name: Record native Binder reference availability
        run: ${{ matrix.python }} -B scripts/probe_binder.py
      - name: Generate real AOSP servicemanager interfaces with the native host compiler
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ matrix.python }} -B scripts/binder_aidl.py
      - name: Preserve generated interfaces and corresponding source without host binaries
        if: always() && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binder-aidl-${{ matrix.os }}
          path: build/m4/binder-aidl/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native Darwin signal-context diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-signal-context
          path: |
            build/host/signal-context/
            build/host/test_signal_context_apple
            build/host/signal-faults/
            build/host/test_signal_faults
            build/host/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Build the pinned NDK ELF and test both packaging inputs
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_pack.py
      - name: Compare the Binder boundary with actual ARM64 NDK UAPI bytes
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_binder_wire.py --host-test build/host/test_binder_wire
      - name: Execute both signed inputs on the native ARM64 CPU
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_native.py
      - name: Compare dynamic ELF program headers with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_dynamic.py
      - name: Compare NDK symbol versions and named lookups with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_versions.py
      - name: Relocate NDK data and compare every writable byte with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_relocation.py
      - name: Compare adapted Bionic objects with their upstream control
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_bionic.py
      - name: Execute a Bionic syscall slice through a signed dynamic wrapper
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_dynamic_wrapper.py
      - name: Initialize real Bionic and run its dynamically linked allocator client
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_bionic_startup.py
      - name: Compare real AOSP references in signed native ARM64 code
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_art_references.py
      - name: Compare ART forwarding words and JNI storage above the native guard
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_art_storage.py
      - name: Preserve ART interpreter argument roots above the native guard
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_art_stack.py
      - name: Preserve the platform register across real LLVM context restoration
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_unwind_context.py
      - name: Preserve LLVM context diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unwind-context-diagnostics
          path: |
            artifacts/m3-unwind-context.json
            build/m3/unwind-context/
          if-no-files-found: warn
          retention-days: 7
      - name: Execute source-built AOSP math through a signed dependency group
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_art_math.py
      - name: Preserve source-built math diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-math-diagnostics
          path: |
            artifacts/m3-art-math.json
            build/m3/art-math/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve interpreter argument diagnostics on failure
        if: failure() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-arguments-diagnostics
          path: |
            artifacts/m3-art-stack.json
            build/m3/art-stack/
          if-no-files-found: warn
          retention-days: 7
      - name: Execute AOSP libdl through the signed guest loader bridge
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_guest_loader.py
      - name: Preserve guest loader diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-loader-diagnostics
          path: |
            artifacts/m3-guest-loader.json
            build/m3/guest-loader/
          if-no-files-found: warn
          retention-days: 7
      - name: Load and verify an original DEX with pinned AOSP code
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_dex_loader.py
      - name: Preserve DEX loader build diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dex-loader-diagnostics
          path: |
            artifacts/m3-dex-loader.json
            build/m3/dex-loader/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Bionic startup diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bionic-startup
          path: |
            artifacts/m2-bionic-startup.json
            artifacts/m2-acceptance.json
            build/m2/bionic-startup/
            build/m2/bionic/native/comparetf2.c.o
            build/m2/bionic/native/vfork/
            build/m2/bionic/native/android-ids/
            build/m2/bionic/upstream/android-ids/upstream-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload host evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-evidence-${{ matrix.os }}
          path: |
            artifacts/host-metrics.json
            artifacts/m4-binder-wire.json
            artifacts/m4-binder-capabilities.json
            artifacts/m4-binder-mapping.log
            build/m4/binder-wire/
            build/host/test_binder_wire
            build/host/test_eventfd_reference
            build/host/test_timerfd_reference
            build/host/test_timerfd
            build/host/Release/test_timerfd.exe
            build/host/test_eventfd
            build/host/Release/test_eventfd.exe
            build/host/Release/test_binder_wire.exe
            artifacts/m3-low-address.json
            build/m3/low-address/
            artifacts/m3-art-references.json
            build/m3/art-references/
            artifacts/m3-art-storage.json
            build/m3/art-storage/
            artifacts/m3-art-stack.json
            build/m3/art-stack/
            artifacts/m3-dex-loader.json
            artifacts/m3-unwind-context.json
            build/m3/unwind-context/
            artifacts/m3-art-math.json
            build/m3/art-math/
            build/m3/dex-loader/*.dex
            artifacts/m1-native.json
            artifacts/m2-metadata.json
            artifacts/m2-versions.json
            build/m2/versions/
            artifacts/m2-relocations.json
            artifacts/m2-bionic-upstream.json
            artifacts/m2-bionic-native.json
            artifacts/m2-bionic-profile-check.json
            artifacts/m2-dynamic-wrapper.json
            artifacts/m2-bionic-startup.json
            build/m2/bionic-startup/futex-check.o
            build/m2/bionic-startup/futex-requeue.o
            build/m2/bionic-startup/file-check.o
            build/m2/bionic-startup/mapping-check.o
            build/m2/bionic-startup/unlink-check.o
            build/m2/bionic-startup/cwd-check.o
            build/m2/bionic-startup/signal-wait.o
            build/m2/bionic-startup/signal-handler.o
            build/m2/bionic-startup/signal-stack.o
            build/m2/bionic-startup/signal-stack-handler.o
            build/m2/bionic-startup/signal-mask-handler.o
            build/m2/bionic-startup/signal-fault.o
            build/m2/bionic-startup/signal-realtime.o
            build/m2/bionic-startup/signal-interrupt.o
            build/m2/bionic-startup/libartbox_versions.so
            build/m2/bionic-startup/version-client.o
            build/m2/bionic-startup/libartbox_tls.so
            build/m2/bionic-startup/libtls_client_linux.so
            build/m2/bionic-startup/tls-original.s
            build/m2/bionic-startup/tls-adapted.s
            build/m2/bionic-startup/tls-original.o
            build/m2/bionic-startup/tls-access.o
            build/m2/bionic-startup/tls-abi.o
            build/m2/bionic-startup/vm-check.o
            build/m2/bionic-startup/proc-check.o
            build/m2/bionic-startup/art-libc-check.o
            build/m2/bionic-startup/libcore-common.o
            build/m2/bionic-startup/libcore-accounts.o
            build/m2/dynamic-wrapper/libartbox_bionic_slice.so
            build/m2/dynamic-wrapper/vm-check.o
            build/m2/dynamic-wrapper/system-check.o
            build/m2/dynamic-wrapper/pack/layout.json
            build/m2/dynamic-wrapper/*/load-commands.txt
            build/m2/dynamic-wrapper/ios/ARTBoxBionicSlice.framework/
            build/m2/bionic/*/bionic-m2-partial.o
            build/m2/bionic/*/BIONIC-NOTICE.txt
            build/m2/bionic/*/LIBCUTILS-NOTICE.txt
            build/m2/bionic/*/SCUDO-NOTICE.txt
            build/m2/bionic/*/GWP_ASAN-NOTICE.txt
            build/m2/bionic/*/ARM-ROUTINES-NOTICE.txt
            build/m2/bionic/*/PROPERTY-INFO-NOTICE.txt
            build/m2/bionic/*/COMPILER-RT-NOTICE.txt
            build/m2/bionic/*/FSCONFIG-NOTICE.txt
            build/m2/bionic/*/android-ids/
            build/m2/bionic/*/binary128-test.o
            build/m2/bionic/native/vfork/
            build/m2/bionic/native/comparetf2.c.o
            build/m2/bionic/*/strings-test.o
            build/m2/bionic/*/allocator-tls-test.o
            build/m2/bionic/*/bionic_inline_raise.h
            build/m2/bionic/*/syscall-test.o
            build/m2/bionic/*/generated/syscall-test.h
            build/m1/hello.elf
            build/m1/elf-build.json
            build/m1/macos/ARTBox*-load-commands.txt
            build/host/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
  runtime-sources:
    name: ART runtime source selection
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch and verify the pinned interpreter source selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/art_runtime_sources.py
      - name: Preserve the source inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-runtime-source-inventory
          path: build/m3/runtime/source-inventory.json
          if-no-files-found: error
          retention-days: 7
  runtime-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - heap: absolute
            name: AOSP ART runtime build (native Linux ARM64)
            argument: ''
            suffix: ''
          - heap: relative
            name: AOSP ART runtime build (managed window, native Linux ARM64)
            argument: --managed-window
            suffix: -managed-window
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile the interpreter and link its native reference harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_runtime.py --profile linux --all --link --jobs 3 ${{ matrix.argument }}
      - name: Build and test native ICU and JNI dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_native_libraries.py --profile linux --all --link --jobs 3
      - name: Build and test the remaining native libcore dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_libcore.py --profile linux --all --link --jobs 3
      - name: Preserve runtime build diagnostics and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-runtime-linux-build${{ matrix.suffix }}
          path: build/m3/runtime-build/linux/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native dependency diagnostics and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-native-libraries-linux${{ matrix.suffix }}
          path: build/m3/native-libraries/linux/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native libcore diagnostics and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-libcore-native-linux${{ matrix.suffix }}
          path: build/m3/libcore-native/linux/
          if-no-files-found: error
          retention-days: 7
  runtime-startup:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - heap: absolute
            name: Original ART interpreter startup (native Linux ARM64)
            suffix: ''
          - heap: relative
            name: ART interpreter startup (managed window, native Linux ARM64)
            suffix: -managed-window
    needs: [runtime-build, class-library, runtime-policy]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-runtime-linux-build${{ matrix.suffix }}
          path: build/m3/runtime-build/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-native-libraries-linux${{ matrix.suffix }}
          path: build/m3/native-libraries/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-libcore-native-linux${{ matrix.suffix }}
          path: build/m3/libcore-native/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: class-library-ubuntu-24.04-arm
          path: build/m3/startup-inputs/classlib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-managed-fixture-ubuntu-24.04-arm
          path: build/m3/managed-fixture
      - name: Start ART and verify hello, GC, exceptions and native attachment
        run: >-
          python3 -B scripts/test_art_startup.py
          --classlib-dir build/m3/startup-inputs/classlib/build/m3/classlib
      - name: Preserve startup result, maps, logs, native libraries, DEX and source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-runtime-startup-linux${{ matrix.suffix }}
          path: build/m3/runtime-startup/
          if-no-files-found: error
          retention-days: 7
  class-library:
    name: AOSP class libraries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned implementation Java and DEX
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_classlib.py --fetch-jdk
      - name: Build the managed ART acceptance fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_managed_fixture.py --fetch-jdk
      - name: Verify class libraries and malformed inputs with AOSP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_dex_loader.py --classlib-root build/m3/classlib
      - name: Preserve class libraries, corresponding source and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: class-library-${{ matrix.os }}
          path: |
            build/m3/classlib/artbox-classlib.zip
            build/m3/classlib/result.json
            build/m3/classlib/attempt-*/*.log
            build/m3/classlib/attempt-*/*.args
            build/m3/dex-loader/
            artifacts/m3-classlib-verifier.json
            artifacts/m3-dex-loader.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the managed fixture and source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-managed-fixture-${{ matrix.os }}
          path: build/m3/managed-fixture/
          if-no-files-found: error
          retention-days: 7
  runtime-policy:
    name: ART runtime policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test stack trace names and reject JIT compiler creation
        env:
