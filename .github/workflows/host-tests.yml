          path: build/m3/guest-classlib-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-managed-fixture-macos-15
          path: build/m3/guest-managed-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bionic-startup
          path: build/m3/guest-dependency-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-math-diagnostics
          path: build/m3/guest-dependency-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guest-loader-diagnostics
          path: build/m3/guest-dependency-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unwind-context-diagnostics
          path: build/m3/guest-dependency-inputs
      - name: Link the complete guest and verify signed framework layouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/link_art_guest.py --runtime-dir build/m3/guest-runtime-inputs --dependency-dir build/m3/guest-dependency-inputs
      - name: Build the shared native bootstrap runner
        run: python3 -B scripts/build.py host
      - name: Execute full guest constructors and the pre-start JNI boundary
        run: python3 -B scripts/test_art_guest_bootstrap.py --guest-dir build/m3/art-guest-link --dependency-dir build/m3/guest-dependency-inputs
      - name: Link ICU dependencies and verify their signed Apple frameworks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/link_icu_guest.py --native-dir build/m3/guest-icu-inputs --guest-dir build/m3/art-guest-link --dependency-dir build/m3/guest-dependency-inputs
      - name: Execute ICU data and Unicode checks through the shared native runtime
        run: python3 -B scripts/test_icu_guest.py --icu-dir build/m3/icu-guest-link --guest-dir build/m3/art-guest-link --dependency-dir build/m3/guest-dependency-inputs
      - name: Preserve signed ICU packaging and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icu-guest-link
          path: |
            artifacts/m3-icu-guest-link.json
            artifacts/m3-icu-guest.json
            build/m3/icu-guest-link/
            build/m3/icu-guest/
            build/host/artbox_native_icu
          if-no-files-found: warn
          retention-days: 7
      - name: Link class libraries and verify their signed Apple frameworks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/link_libcore_guest.py --native-dir build/m3/guest-libcore-inputs --icu-dir build/m3/icu-guest-link --guest-dir build/m3/art-guest-link --dependency-dir build/m3/guest-dependency-inputs
      - name: Execute native class libraries through signed Bionic and ART dependencies
        run: python3 -B scripts/test_icu_guest.py --libcore-dir build/m3/libcore-guest-link --icu-dir build/m3/icu-guest-link --guest-dir build/m3/art-guest-link --dependency-dir build/m3/guest-dependency-inputs
      - name: Start signed ART and execute hello, GC, exceptions and native attachment
        run: >-
          python3 -B scripts/test_icu_guest.py
          --libcore-dir build/m3/libcore-guest-link --icu-dir build/m3/icu-guest-link
          --guest-dir build/m3/art-guest-link --dependency-dir build/m3/guest-dependency-inputs
          --classlib-dir build/m3/guest-classlib-inputs/build/m3/classlib
          --managed-fixture-dir build/m3/guest-managed-inputs
      - name: Preserve signed JavaVM and DEX execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-runtime-guest
          path: |
            artifacts/m3-art-runtime-guest.json
            build/m3/art-runtime-guest/
            build/host/artbox_native_art_runtime
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve signed class libraries and native execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcore-guest-link
          path: |
            artifacts/m3-libcore-guest-link.json
            artifacts/m3-libcore-guest.json
            build/m3/libcore-guest-link/
            build/m3/libcore-guest/
            build/host/artbox_native_libcore
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the full guest link and signature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-guest-link
          path: |
            artifacts/m3-art-guest-link.json
            artifacts/m3-art-guest-bootstrap.json
            build/m3/art-guest-link/
            build/m3/art-guest-bootstrap/
            build/host/artbox_native_art_bootstrap
          if-no-files-found: warn
          retention-days: 7

