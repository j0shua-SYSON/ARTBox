name: host-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
          - os: ubuntu-24.04
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test the portable core
        run: |
          ${{ matrix.python }} -B tests/test_environment.py
          ${{ matrix.python }} -B tests/test_sources.py
          ${{ matrix.python }} -B tests/test_bionic_adapt.py
          ${{ matrix.python }} -B tests/test_bionic_syscalls.py
          ${{ matrix.python }} -B tests/test_dynamic_pack.py
          ${{ matrix.python }} -B scripts/build.py host
      - name: Build the pinned NDK ELF and test both packaging inputs
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_pack.py
      - name: Execute both signed inputs on the native ARM64 CPU
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_native.py
      - name: Compare dynamic ELF program headers with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_dynamic.py
      - name: Compare NDK symbol versions and named lookups with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_versions.py
      - name: Relocate NDK data and compare every writable byte with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_relocation.py
      - name: Compare adapted Bionic objects with their upstream control
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/test_bionic.py
      - name: Execute a Bionic syscall slice through a signed dynamic wrapper
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_dynamic_wrapper.py
      - name: Initialize real Bionic and run its dynamically linked allocator client
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_bionic_startup.py
      - name: Preserve Bionic startup diagnostics
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bionic-startup
          path: |
            artifacts/m2-bionic-startup.json
            build/m2/bionic-startup/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload host evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-evidence-${{ matrix.os }}
          path: |
            artifacts/host-metrics.json
            artifacts/m1-native.json
            artifacts/m2-metadata.json
            artifacts/m2-versions.json
            build/m2/versions/
            artifacts/m2-relocations.json
            artifacts/m2-bionic-upstream.json
            artifacts/m2-bionic-native.json
            artifacts/m2-bionic-profile-check.json
            artifacts/m2-dynamic-wrapper.json
            artifacts/m2-bionic-startup.json
            build/m2/bionic-startup/futex-check.o
            build/m2/bionic-startup/file-check.o
            build/m2/bionic-startup/mapping-check.o
            build/m2/bionic-startup/libartbox_versions.so
            build/m2/bionic-startup/version-client.o
            build/m2/dynamic-wrapper/libartbox_bionic_slice.so
            build/m2/dynamic-wrapper/vm-check.o
            build/m2/dynamic-wrapper/system-check.o
            build/m2/dynamic-wrapper/pack/layout.json
            build/m2/dynamic-wrapper/*/load-commands.txt
            build/m2/dynamic-wrapper/ios/ARTBoxBionicSlice.framework/
            build/m2/bionic/*/bionic-m2-partial.o
            build/m2/bionic/*/BIONIC-NOTICE.txt
            build/m2/bionic/*/LIBCUTILS-NOTICE.txt
            build/m2/bionic/*/SCUDO-NOTICE.txt
            build/m2/bionic/*/GWP_ASAN-NOTICE.txt
            build/m2/bionic/*/ARM-ROUTINES-NOTICE.txt
            build/m2/bionic/*/PROPERTY-INFO-NOTICE.txt
            build/m2/bionic/*/COMPILER-RT-NOTICE.txt
            build/m2/bionic/*/binary128-test.o
            build/m2/bionic/*/strings-test.o
            build/m2/bionic/*/allocator-tls-test.o
            build/m2/bionic/*/bionic_inline_raise.h
            build/m2/bionic/*/syscall-test.o
            build/m2/bionic/*/generated/syscall-test.h
            build/m1/hello.elf
            build/m1/elf-build.json
            build/m1/macos/ARTBox*-load-commands.txt
            build/host/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
  linux-oracle:
    name: unchanged ELF on native Linux ARM64
    needs: host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-evidence-macos-15
          path: build/oracle
      - name: Run the exact ELF used by both Mac packaging candidates
        run: >-
          python3 -B scripts/test_native.py --platform linux
          --elf build/oracle/build/m1/hello.elf
          --manifest build/oracle/artifacts/m1-native.json
      - name: Compare Bionic inline signals with the original native Linux path
        run: python3 -B scripts/test_bionic_raise.py --evidence-root build/oracle
      - name: Execute NDK Bionic syscall entries and the real errno helper
        run: python3 -B scripts/test_bionic_syscalls.py --evidence-root build/oracle
      - name: Compare the original and adapted allocator thread-local state
        run: python3 -B scripts/test_allocator_tls.py --evidence-root build/oracle
      - name: Check the NDK string objects against scalar and guarded-page oracles
        run: python3 -B scripts/test_bionic_strings.py --evidence-root build/oracle
      - name: Compare signed-wrapper memory operations with the original Bionic Linux path
        run: python3 -B scripts/test_bionic_vm.py --evidence-root build/oracle
      - name: Check Android binary128 arithmetic without crossing the host floating ABI
        run: python3 -B scripts/test_bionic_binary128.py --evidence-root build/oracle
      - name: Compare the signed Bionic futex caller with both original Linux paths
        run: python3 -B scripts/test_bionic_futex.py --evidence-root build/oracle
      - name: Compare signed Bionic versioned imports with native Linux
        run: python3 -B scripts/test_versioned_call.py --evidence-root build/oracle
      - name: Compare signed Bionic file operations with both original Linux paths
        run: python3 -B scripts/test_bionic_files.py --evidence-root build/oracle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-arm64-oracle
          path: |
            artifacts/m1-linux.json
            artifacts/m2-inline-raise-linux.json
            artifacts/m2-syscall-stubs-linux.json
            artifacts/m2-allocator-tls-linux.json
            artifacts/m2-strings-linux.json
            artifacts/m2-vm-linux.json
            artifacts/m2-binary128-linux.json
            artifacts/m2-futex-linux.json
            artifacts/m2-files-linux.json
            artifacts/m2-versioned-linux.json
            build/m2/versioned-call/native.log
            build/m2/files-oracle/*.log
          if-no-files-found: error
          retention-days: 7
