  art-native-guest-build:
    name: AOSP ART Android guest build (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile the managed runtime with the native guest TLS boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_runtime.py --profile android --managed-window --native-guest --all --jobs 3
      - name: Compile the pinned Android ICU and nativehelper dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_native_libraries.py --profile android --all --jobs 3
      - name: Compile the pinned Android class libraries and native callers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_art_libcore.py --profile android --all --runtime-dir build/m3/runtime-build/native-guest --jobs 3
      - name: Preserve Android class libraries and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcore-native-guest-build
          path: |
            build/m3/libcore-native/android/*.json
            build/m3/libcore-native/android/*.log
            build/m3/libcore-native/android/*.zip
            build/m3/libcore-native/android/objects/
            build/m3/libcore-native/android/notices/
            build/m3/libcore-native/android/integer128/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Android ICU objects and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icu-native-guest-build
          path: |
            build/m3/native-libraries/android/*.json
            build/m3/native-libraries/android/*.log
            build/m3/native-libraries/android/*.zip
            build/m3/native-libraries/android/objects/
            build/m3/native-libraries/android/notices/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve guest objects and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-native-guest-build
          path: |
            build/m3/runtime-build/native-guest/*.json
            build/m3/runtime-build/native-guest/*.log
            build/m3/runtime-build/native-guest/*.zip
            build/m3/runtime-build/native-guest/objects/
            build/m3/runtime-build/native-guest/compiler-tls/
            build/m3/runtime-build/native-guest/notices/
          if-no-files-found: warn
          retention-days: 7

  art-guest-link:
    name: Full ART guest link, signed frameworks and native bootstrap
    needs: [host, art-native-guest-build, class-library]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: art-native-guest-build
          path: build/m3/guest-runtime-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: icu-native-guest-build
          path: build/m3/guest-icu-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcore-native-guest-build
          path: build/m3/guest-libcore-inputs
