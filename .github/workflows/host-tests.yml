      - name: Compare the signed Bionic proc snapshot with native Linux
        run: python3 -B scripts/test_proc.py --evidence-root build/oracle
      - name: Compare signed Bionic file operations with both original Linux paths
        run: python3 -B scripts/test_bionic_files.py --evidence-root build/oracle
      - name: Compare the identical signed Bionic signal-wait caller with native Linux
        run: python3 -B scripts/test_signal_wait.py --evidence-root build/oracle
      - name: Compare the signed Bionic handler source with native Linux
        run: python3 -B scripts/test_signal_handler.py --evidence-root build/oracle
      - name: Compare signed Bionic alternate-stack behavior with native Linux
        run: python3 -B scripts/test_signal_stack.py --evidence-root build/oracle
      - name: Compare signed Bionic handler masks with native Linux
        run: python3 -B scripts/test_signal_mask.py --evidence-root build/oracle
      - name: Compare signed Bionic fault delivery with native Linux
        run: python3 -B scripts/test_signal_fault.py --evidence-root build/oracle
      - name: Compare the signed interruption caller with native Linux
        run: python3 -B scripts/test_signal_interrupt.py --evidence-root build/oracle
      - name: Compare ART libc dependency calls with native Linux
        run: python3 -B scripts/test_art_bionic.py --evidence-root build/oracle
      - name: Compare numeric resolver and bounded string calls with native Linux
        run: python3 -B scripts/test_libcore_frontends.py --evidence-root build/oracle
      - name: Compare original AOSP reference types with the signed adaptation
        run: python3 -B scripts/test_art_references.py --evidence-root build/oracle
      - name: Compare original ART forwarding and JNI storage with signed high-address code
        run: python3 -B scripts/test_art_storage.py --evidence-root build/oracle
      - name: Compare original ART argument copying with signed high-address code
        run: python3 -B scripts/test_art_stack.py --evidence-root build/oracle
      - name: Compare original and adapted LLVM contexts on native Linux
