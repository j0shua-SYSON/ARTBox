name: host-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
          - os: ubuntu-24.04
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test the portable core
        run: |
          ${{ matrix.python }} -B tests/test_environment.py
          ${{ matrix.python }} -B tests/test_sources.py
          ${{ matrix.python }} -B scripts/build.py host
      - name: Build the pinned NDK ELF and test both packaging inputs
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_pack.py
      - name: Execute both signed inputs on the native ARM64 CPU
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_native.py
      - name: Compare dynamic ELF program headers with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_dynamic.py
      - name: Relocate NDK data and compare every writable byte with LLVM
        if: matrix.os == 'macos-15'
        run: python3 -B scripts/test_relocation.py
      - name: Compile pinned Bionic objects and inventory remaining native boundaries
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/build_bionic.py
      - name: Upload host evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-evidence-${{ matrix.os }}
          path: |
            artifacts/host-metrics.json
            artifacts/m1-native.json
            artifacts/m2-metadata.json
            artifacts/m2-relocations.json
            artifacts/m2-bionic-objects.json
            build/m2/bionic/bionic-m2-partial.o
            build/m2/bionic/BIONIC-NOTICE.txt
            build/m1/hello.elf
            build/m1/elf-build.json
            build/m1/macos/ARTBox*-load-commands.txt
            build/host/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
  linux-oracle:
    name: unchanged ELF on native Linux ARM64
    needs: host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      ARTBOX_ISOLATE_HOME: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-evidence-macos-15
          path: build/oracle
      - name: Run the exact ELF used by both Mac packaging candidates
        run: >-
          python3 -B scripts/test_native.py --platform linux
          --elf build/oracle/build/m1/hello.elf
          --manifest build/oracle/artifacts/m1-native.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-oracle
          path: artifacts/m1-linux.json
          if-no-files-found: error
          retention-days: 7
